<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="40%" stop-color="#047857" />
      <stop offset="100%" stop-color="#0f766e" />
    </linearGradient>
    <linearGradient id="accentGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="shadow1" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bgGrad1)" />

  <!-- Geometric Abstract Tech Shapes -->
  <circle cx="1100" cy="100" r="280" fill="#10b981" opacity="0.15" />
  <circle cx="150" cy="550" r="220" fill="#06b6d4" opacity="0.12" />
  <rect x="850" y="280" width="300" height="300" rx="36" fill="#ffffff" opacity="0.04" transform="rotate(25 850 280)" />

  <!-- Top Brand Tag -->
  <rect x="80" y="60" width="340" height="46" rx="23" fill="#ffffff" opacity="0.15" />
  <text x="105" y="90" fill="#a7f3d0" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="bold" letter-spacing="1">
    ★ THE MASTER SAHIB SERIES
  </text>

  <!-- Notification Badge -->
  <rect x="80" y="130" width="220" height="36" rx="8" fill="url(#accentGrad1)" />
  <text x="95" y="154" fill="#064e3b" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="900" letter-spacing="0.5">
    OFFICIAL NOTIFICATION
  </text>

  <!-- Main Urdu Heading -->
  <text x="80" y="240" fill="#ffffff" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', 'Urdu Typesetting', Arial, sans-serif" font-size="46" font-weight="bold" filter="url(#shadow1)">
    سندھ ٹیچنگ لائسنس (STEDA) گائیڈ لائنز
  </text>

  <!-- English Subtitle -->
  <text x="80" y="300" fill="#93c5fd" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="600">
    Sindh Teaching License 2026 — Eligibility, Syllabus &amp; Past Papers
  </text>

  <!-- Feature List Card -->
  <rect x="80" y="350" width="680" height="230" rx="20" fill="#000000" opacity="0.25" />
  
  <text x="110" y="405" fill="#f0fdf4" font-family="system-ui, sans-serif" font-size="22" font-weight="bold">
    ✓ Junior &amp; High School Teachers Licensing
  </text>
  <text x="110" y="455" fill="#f0fdf4" font-family="system-ui, sans-serif" font-size="22" font-weight="bold">
    ✓ Complete Past Papers, Syllabus &amp; Quizzes
  </text>
  <text x="110" y="505" fill="#f0fdf4" font-family="system-ui, sans-serif" font-size="22" font-weight="bold">
    ✓ Online Preparation Hub on themastersahib.com
  </text>
  <text x="110" y="555" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="19" font-weight="600">
    👉 وزٹ کریں اور تیاری شروع کریں: themastersahib.com/teaching-license
  </text>

  <!-- Right Graphic Badge -->
  <g transform="translate(850, 180)" filter="url(#shadow1)">
    <rect width="270" height="360" rx="24" fill="#ffffff" opacity="0.1" stroke="#34d399" stroke-width="2" />
    <circle cx="135" cy="120" r="65" fill="#10b981" opacity="0.3" />
    <text x="135" y="135" fill="#ffffff" font-family="system-ui, sans-serif" font-size="54" font-weight="bold" text-anchor="middle">
      🎓
    </text>
    <text x="135" y="230" fill="#ffffff" font-family="system-ui, sans-serif" font-size="24" font-weight="bold" text-anchor="middle">
      STEDA 2026
    </text>
    <text x="135" y="270" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="middle">
      TEACHING LICENSE
    </text>
    <rect x="45" y="295" width="180" height="40" rx="10" fill="url(#accentGrad1)" />
    <text x="135" y="322" fill="#064e3b" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">
      PREPARE NOW
    </text>
  </g>
</svg>
