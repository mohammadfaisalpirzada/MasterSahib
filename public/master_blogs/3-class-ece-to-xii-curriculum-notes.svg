<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="accentGrad3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <filter id="shadow3" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bgGrad3)" />

  <!-- Shapes -->
  <circle cx="1100" cy="120" r="260" fill="#0284c7" opacity="0.2" />
  <circle cx="150" cy="560" r="230" fill="#10b981" opacity="0.12" />

  <!-- Top Brand Tag -->
  <rect x="80" y="60" width="340" height="46" rx="23" fill="#ffffff" opacity="0.15" />
  <text x="105" y="90" fill="#bae6fd" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="bold" letter-spacing="1">
    ★ THE MASTER SAHIB SERIES
  </text>

  <!-- Notification Badge -->
  <rect x="80" y="130" width="220" height="36" rx="8" fill="url(#accentGrad3)" />
  <text x="95" y="154" fill="#0f172a" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="900" letter-spacing="0.5">
    DIGITAL CURRICULUM
  </text>

  <!-- Main Title -->
  <text x="80" y="240" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="46" font-weight="900" filter="url(#shadow3)">
    Class ECE to XII Digital Books &amp; Planning
  </text>

  <!-- Subtitle Urdu -->
  <text x="80" y="300" fill="#7dd3fc" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', Arial, sans-serif" font-size="30" font-weight="bold">
    پری پرائمری سے بارہویں جماعت تک ڈیجیٹل کتابیں اور حل شدہ اسباق
  </text>

  <!-- Feature List -->
  <rect x="80" y="350" width="680" height="230" rx="20" fill="#000000" opacity="0.3" />
  
  <text x="110" y="405" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="22" font-weight="bold">
    📚 Complete SLO Based Notes &amp; Solved Exercises
  </text>
  <text x="110" y="455" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="22" font-weight="bold">
    📝 Interactive Worksheet Builder &amp; Exam Question Bank
  </text>
  <text x="110" y="505" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="22" font-weight="bold">
    📱 100% Mobile Friendly Reading &amp; Free PDF Downloads
  </text>
  <text x="110" y="555" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="19" font-weight="600">
    👉 کتابیں پڑھیں: themastersahib.com/class_notes
  </text>

  <!-- Right Side Visual Card -->
  <g transform="translate(850, 180)" filter="url(#shadow3)">
    <rect width="270" height="360" rx="24" fill="#ffffff" opacity="0.08" stroke="#38bdf8" stroke-width="2" />
    <circle cx="135" cy="120" r="65" fill="#0284c7" opacity="0.4" />
    <text x="135" y="135" fill="#ffffff" font-family="system-ui, sans-serif" font-size="54" font-weight="bold" text-anchor="middle">
      📖
    </text>
    <text x="135" y="230" fill="#ffffff" font-family="system-ui, sans-serif" font-size="24" font-weight="bold" text-anchor="middle">
      ECE — XII
    </text>
    <text x="135" y="270" fill="#7dd3fc" font-family="system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="middle">
      CURRICULUM 2026
    </text>
    <rect x="45" y="295" width="180" height="40" rx="10" fill="url(#accentGrad3)" />
    <text x="135" y="322" fill="#0f172a" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">
      READ BOOKS
    </text>
  </g>
</svg>
