<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#312e81" />
      <stop offset="100%" stop-color="#4338ca" />
    </linearGradient>
    <linearGradient id="accentGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="shadow2" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bgGrad2)" />

  <!-- Abstract Tech Grid & Orbs -->
  <circle cx="1050" cy="150" r="300" fill="#6366f1" opacity="0.2" />
  <circle cx="200" cy="550" r="250" fill="#38bdf8" opacity="0.15" />
  <rect x="700" y="80" width="450" height="260" rx="30" fill="#ffffff" opacity="0.03" transform="rotate(-15 700 80)" />

  <!-- Top Brand Badge -->
  <rect x="80" y="60" width="340" height="46" rx="23" fill="#ffffff" opacity="0.15" />
  <text x="105" y="90" fill="#bae6fd" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="bold" letter-spacing="1">
    ★ THE MASTER SAHIB SERIES
  </text>

  <!-- Product Category Pill -->
  <rect x="80" y="130" width="220" height="36" rx="8" fill="url(#accentGrad2)" />
  <text x="95" y="154" fill="#0f172a" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="900" letter-spacing="0.5">
    AI SOFTWARE STUDIO
  </text>

  <!-- Main Title -->
  <text x="80" y="240" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="46" font-weight="900" filter="url(#shadow2)">
    MasterSahib Video Editor (MSVE)
  </text>

  <!-- Subtitle Urdu -->
  <text x="80" y="300" fill="#a5b4fc" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', Arial, sans-serif" font-size="30" font-weight="bold">
    اساتذہ اور یوٹیوبرز کے لیے جدید اے آئی ویڈیو مرجر اور سوشل اسٹوڈیو
  </text>

  <!-- Feature List Box -->
  <rect x="80" y="350" width="680" height="230" rx="20" fill="#000000" opacity="0.3" />
  
  <text x="110" y="405" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="22" font-weight="bold">
    🎬 Sequence Audio &amp; Video Merger in 1 Click
  </text>
  <text x="110" y="455" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="22" font-weight="bold">
    ⚡ High-Speed Browser Rendering — No Watermark
  </text>
  <text x="110" y="505" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="22" font-weight="bold">
    📈 Built-in Social SEO Studio for Educational Channels
  </text>
  <text x="110" y="555" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="19" font-weight="600">
    👉 اب مفت استعمال کریں: themastersahib.com/softwares/video-editor
  </text>

  <!-- Right Side Visual Showcase -->
  <g transform="translate(850, 180)" filter="url(#shadow2)">
    <rect width="270" height="360" rx="24" fill="#ffffff" opacity="0.08" stroke="#818cf8" stroke-width="2" />
    <circle cx="135" cy="120" r="65" fill="#6366f1" opacity="0.4" />
    <text x="135" y="135" fill="#ffffff" font-family="system-ui, sans-serif" font-size="54" font-weight="bold" text-anchor="middle">
      🎬
    </text>
    <text x="135" y="230" fill="#ffffff" font-family="system-ui, sans-serif" font-size="24" font-weight="bold" text-anchor="middle">
      MSVE AI
    </text>
    <text x="135" y="270" fill="#93c5fd" font-family="system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="middle">
      ONLINE EDITOR
    </text>
    <rect x="45" y="295" width="180" height="40" rx="10" fill="url(#accentGrad2)" />
    <text x="135" y="322" fill="#0f172a" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">
      LAUNCH STUDIO
    </text>
  </g>
</svg>
